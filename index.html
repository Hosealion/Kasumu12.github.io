<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full D&D Character Sheet</title>

<style>
:root{
  --bg:#2b2f26;
  --paper:#fdfaf4;
  --ink:#1f1f1f;
  --muted:#666;
  --accent:#7b8f5a;
  --line:#c9c4b8;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  font-family:system-ui,sans-serif;
  padding:.75rem;
}
.sheet{
  max-width:1100px;
  margin:auto;
  background:var(--paper);
  padding:1rem;
  border-radius:12px;
}
h1{text-align:center}
label{font-size:.65rem;text-transform:uppercase;color:#666}
input,textarea{
  width:100%;
  padding:.35rem;
  border:1px solid #ccc;
  border-radius:6px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.4rem}
.top{display:grid;grid-template-columns:160px 1fr;gap:.8rem}
table{width:100%;border-collapse:collapse;font-size:.75rem}
th,td{border:1px solid #ccc;padding:.25rem}
.bar{height:16px;background:#333;border-radius:999px;overflow:hidden}
.fill{height:100%;width:0%}
</style>
</head>

<body>
<div class="sheet">

<h1>D&D Character Sheet</h1>

<div class="top">
  <div>
    <img id="portrait" style="display:none;width:100%;border-radius:8px">
    <input type="file" id="portraitUpload" accept="image/*">
  </div>
  <div class="grid">
    <div><label>Name</label><input id="name" data-save></div>
    <div><label>Class & Level</label><input id="level" data-save></div>
    <div><label>Race</label><input id="race" data-save></div>
    <div><label>Background</label><input id="background" data-save></div>
    <div><label>Alignment</label><input id="alignment" data-save></div>
    <div><label>Player</label><input id="player" data-save></div>
  </div>
</div>

<h2>Ability Scores</h2>
<table>
<tr><th>Ability</th><th>Score</th><th>Modifier</th></tr>
<tr><td>STR</td><td><input id="str" data-ability="str" data-save></td><td><input id="strMod" data-mod data-mod-ability="str" data-save></td></tr>
<tr><td>DEX</td><td><input id="dex" data-ability="dex" data-save></td><td><input id="dexMod" data-mod data-mod-ability="dex" data-save></td></tr>
<tr><td>CON</td><td><input id="con" data-ability="con" data-save></td><td><input id="conMod" data-mod data-mod-ability="con" data-save></td></tr>
<tr><td>INT</td><td><input id="int" data-ability="int" data-save></td><td><input id="intMod" data-mod data-mod-ability="int" data-save></td></tr>
<tr><td>WIS</td><td><input id="wis" data-ability="wis" data-save></td><td><input id="wisMod" data-mod data-mod-ability="wis" data-save></td></tr>
<tr><td>CHA</td><td><input id="cha" data-ability="cha" data-save></td><td><input id="chaMod" data-mod data-mod-ability="cha" data-save></td></tr>
</table>

<h2>HP</h2>
<div class="grid">
  <div><label>HP Max</label><input id="hpMax" type="number" data-save></div>
  <div><label>Current HP</label><input id="hpCur" type="number" data-save></div>
  <div><label>Temp HP</label><input id="hpTemp" type="number" data-save></div>
</div>
<div class="bar"><div id="hpBar" class="fill" style="background:green"></div></div>

<footer style="text-align:center;font-size:.6rem;margin-top:.6rem">
Autosaves locally • Offline ready
</footer>

<script>
/* =======================
   AUTOSAVE (FIXED)
======================= */
document.addEventListener("DOMContentLoaded", () => {

  document.querySelectorAll("[data-save]").forEach(el => {
    const key = "cs_" + el.id;

    if (el.type === "checkbox") {
      el.checked = localStorage.getItem(key) === "true";
      el.addEventListener("change", () =>
        localStorage.setItem(key, el.checked)
      );
    } else if (el.type !== "file") {
      el.value = localStorage.getItem(key) ?? "";
      el.addEventListener("input", () =>
        localStorage.setItem(key, el.value)
      );
    }
  });

});

/* =======================
   PORTRAIT
======================= */
const img=document.getElementById("portrait");
const up=document.getElementById("portraitUpload");
const savedImg=localStorage.getItem("portrait");
if(savedImg){img.src=savedImg;img.style.display="block";}
up.onchange=()=>{
  const r=new FileReader();
  r.onload=e=>{
    img.src=e.target.result;
    img.style.display="block";
    localStorage.setItem("portrait",e.target.result);
  }
  r.readAsDataURL(up.files[0]);
};

/* =======================
   HP BAR
======================= */
const hpMax=document.getElementById("hpMax"),
      hpCur=document.getElementById("hpCur"),
      hpTemp=document.getElementById("hpTemp"),
      hpBar=document.getElementById("hpBar");

function updateHP(){
  const m=+hpMax.value||1,
        c=+hpCur.value||0,
        t=+hpTemp.value||0;
  hpBar.style.width=Math.min(100,(c+t)/m*100)+"%";
}
[hpMax,hpCur,hpTemp].forEach(e=>e.oninput=updateHP);
updateHP();

/* =======================
   MODIFIERS
======================= */
document.querySelectorAll("[data-ability]").forEach(a=>{
  a.oninput=()=>{
    const mod=Math.floor(((+a.value||10)-10)/2);
    document.querySelector(`[data-mod-ability="${a.dataset.ability}"]`).value=mod;
  };
});
</script>

</div>
</body>
</html>
