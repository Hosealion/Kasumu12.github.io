<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sturdy Bench – Character Sheet</title>

<style>
  body {
    background: #2e3328;
    font-family: Georgia, serif;
    padding: 1rem;
  }

  .sheet {
    max-width: 1100px;
    margin: auto;
    background: #fdfaf4;
    padding: 1.2rem;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,.4);
  }

  h1, h2 { text-align: center; }
  h2 { border-bottom: 2px solid #333; margin-top: 1.4rem; }

  label { font-weight: bold; font-size: 0.8rem; }

  input, textarea {
    width: 100%;
    padding: 0.4rem;
    font-size: 0.95rem;
    border-radius: 4px;
    border: 1px solid #999;
  }

  textarea { min-height: 60px; resize: vertical; }

  .top {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 1rem;
  }

  .portrait img {
    width: 100%;
    border-radius: 12px;
    border: 3px solid #333;
    display: none;
  }

  #portrait-upload {
    margin-top: 0.4rem;
    font-size: 0.75rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.6rem;
  }

  .abilities {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0.5rem;
  }

  .ability {
    background: #e6e1d7;
    padding: 0.4rem;
    border-radius: 6px;
    text-align: center;
    border: 1px solid #999;
  }

  .mod-input {
    width: 50px;
    text-align: center;
    font-weight: bold;
  }

  footer {
    text-align: center;
    margin-top: 1rem;
    font-size: 0.75rem;
    opacity: 0.7;
  }
</style>
</head>

<body>
<div class="sheet">

<h1>Character Sheet</h1>

<!-- TOP -->
<div class="top">
  <div class="portrait">
    <img id="char-portrait" alt="Character Portrait">
    <input type="file" id="portrait-upload" accept="image/*">
  </div>

  <div class="grid">
    <div><label>Name</label><input data-save></div>
    <div><label>Class & Level</label><input data-save id="class-level"></div>
    <div><label>Race</label><input data-save></div>
    <div><label>Background</label><input data-save></div>
    <div><label>Alignment</label><input data-save></div>
    <div><label>Player</label><input data-save></div>
  </div>
</div>

<!-- CHARACTER DETAILS -->
<h2>Character Details</h2>
<div class="grid">
  <div><label>Age</label><input data-save></div>
  <div><label>Eyes</label><input data-save></div>
  <div><label>Height</label><input data-save></div>
  <div><label>Skin</label><input data-save></div>
</div>

<label>Backstory</label>
<textarea data-save></textarea>

<footer>Autosaves locally • Offline ready</footer>

<script>
// AUTOSAVE FIELDS
document.querySelectorAll("[data-save]").forEach((field, i) => {
  const key = "sturdybench_" + i;
  if (field.type === "checkbox") {
    field.checked = localStorage.getItem(key) === "true";
    field.addEventListener("change", () => localStorage.setItem(key, field.checked));
  } else {
    field.value = localStorage.getItem(key) || "";
    field.addEventListener("input", () => localStorage.setItem(key, field.value));
  }
});

// PORTRAIT UPLOAD + SAVE
const portraitImg = document.getElementById("char-portrait");
const portraitUpload = document.getElementById("portrait-upload");

const savedPortrait = localStorage.getItem("sturdybench_portrait");
if (savedPortrait) {
  portraitImg.src = savedPortrait;
  portraitImg.style.display = "block";
}

portraitUpload.addEventListener("change", () => {
  const file = portraitUpload.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    portraitImg.src = e.target.result;
    portraitImg.style.display = "block";
    localStorage.setItem("sturdybench_portrait", e.target.result);
  };
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
