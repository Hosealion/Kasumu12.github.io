<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Full Screen Character Sheet</title>

<style>
:root{
  --bg:#252a21;
  --paper:#fdfaf4;
  --line:#c9c4b8;
  --muted:#666;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  font-family:system-ui,Segoe UI,sans-serif;
  padding:.25rem;
}

/* FULL SCREEN GRID */
.sheet{
  width:100%;
  height:99vh;
  background:var(--paper);
  border-radius:10px;
  padding:.4rem;
  display:grid;
  grid-template-columns:220px 1fr 340px;
  gap:.4rem;
}

/* COLUMNS */
.left,.center,.right{
  display:flex;
  flex-direction:column;
  gap:.35rem;
}

/* CARDS */
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  padding:.35rem;
}

/* TYPOGRAPHY */
h1{
  font-size:1.1rem;
  margin:.1rem 0;
  text-align:center;
}

h2{
  font-size:.6rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:.15rem 0 .25rem;
  border-bottom:1px solid var(--line);
}

label{
  font-size:.55rem;
  text-transform:uppercase;
  color:var(--muted);
}

input,textarea{
  width:100%;
  padding:.22rem;
  font-size:.7rem;
  border:1px solid var(--line);
  border-radius:5px;
}

textarea{resize:vertical;min-height:50px}

/* LAYOUT HELPERS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(60px,1fr));
  gap:.25rem;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:.68rem;
}

th,td{
  border:1px solid var(--line);
  padding:.18rem;
  text-align:center;
}

th{
  background:#ece7db;
  font-size:.55rem;
}

.bar{
  height:12px;
  background:#333;
  border-radius:999px;
  overflow:hidden;
  margin:.1rem 0;
}

.fill{height:100%;width:0%;transition:.2s}

details summary{
  cursor:pointer;
  font-size:.6rem;
  text-transform:uppercase;
}

/* PORTRAIT */
.portrait img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  border-radius:6px;
  border:2px solid #333;
  display:none;
}
</style>
</head>

<body>

<div class="sheet">

<!-- LEFT COLUMN -->
<div class="left">
  <h1>D&D Sheet</h1>

  <div class="card portrait">
    <img id="portrait">
    <input type="file" id="portraitUpload" accept="image/*">
  </div>

  <div class="card">
    <label>Name</label><input data-save>
    <label>Class & Level</label><input id="level" data-save>
    <label>Race</label><input data-save>
    <label>Background</label><input data-save>
  </div>

  <div class="card">
    <h2>Abilities</h2>
    <table>
      <tr><th>STR</th><td><input data-ability data-save></td><td><input data-mod data-save></td></tr>
      <tr><th>DEX</th><td><input data-ability data-save></td><td><input data-mod data-save></td></tr>
      <tr><th>CON</th><td><input data-ability data-save></td><td><input data-mod data-save></td></tr>
      <tr><th>INT</th><td><input data-ability data-save></td><td><input data-mod data-save></td></tr>
      <tr><th>WIS</th><td><input data-ability data-save></td><td><input data-mod data-save></td></tr>
      <tr><th>CHA</th><td><input data-ability data-save></td><td><input data-mod data-save></td></tr>
    </table>
  </div>
</div>

<!-- CENTER COLUMN -->
<div class="center">
  <div class="card">
    <h2>Combat</h2>
    <div class="grid">
      <div><label>AC</label><input data-save></div>
      <div><label>Init</label><input data-save></div>
      <div><label>Speed</label><input data-save></div>
      <div><label>Block</label><input data-save></div>
    </div>

    <label>HP</label>
    <div class="grid">
      <input id="hpMax" placeholder="Max">
      <input id="hpCur" placeholder="Cur">
      <input id="hpTemp" placeholder="Temp">
    </div>
    <div class="bar"><div id="hpBar" class="fill"></div></div>

    <label>Mana</label>
    <div class="grid">
      <input id="manaMax" placeholder="Max">
      <input id="manaCur" placeholder="Cur">
    </div>
    <div class="bar"><div id="manaBar" class="fill" style="background:#4aa3ff"></div></div>
  </div>

  <!-- SKILLS – FULLY VISIBLE -->
  <div class="card">
    <h2>Skills</h2>
    <table id="skills">
      <tr><th>Skill</th><th>Abil</th><th>Prof</th><th>Total</th></tr>
      <tr data-ability="dex"><td>Acrobatics</td><td>DEX</td><td><input type="checkbox" class="prof" data-save></td><td><input class="total" readonly></td></tr>
      <tr data-ability="wis"><td>Animal</td><td>WIS</td><td><input type="checkbox" class="prof" data-save></td><td><input class="total" readonly></td></tr>
      <tr data-ability="int"><td>Arcana</td><td>INT</td><td><input type="checkbox" class="prof" data-save></td><td><input class="total" readonly></td></tr>
      <tr data-ability="str"><td>Athletics</td><td>STR</td><td><input type="checkbox" class="prof" data-save></td><td><input class="total" readonly></td></tr>
      <tr data-ability="cha"><td>Deception</td><td>CHA</td><td><input type="checkbox" class="prof" data-save></td><td><input class="total" readonly></td></tr>
      <tr data-ability="wis"><td>Insight</td><td>WIS</td><td><input type="checkbox" class="prof" data-save></td><td><input class="total" readonly></td></tr>
      <tr data-ability="wis"><td>Perception</td><td>WIS</td><td><input type="checkbox" class="prof" data-save></td><td><input class="total" readonly></td></tr>
      <tr data-ability="dex"><td>Stealth</td><td>DEX</td><td><input type="checkbox" class="prof" data-save></td><td><input class="total" readonly></td></tr>
    </table>
  </div>
</div>

<!-- RIGHT COLUMN -->
<div class="right">
  <div class="card">
    <h2>Weapons</h2>
    <table>
      <tr><th>Name</th><th>Atk</th><th>Dmg</th></tr>
      <tr><td><input data-save></td><td><input data-save></td><td><input data-save></td></tr>
      <tr><td><input data-save></td><td><input data-save></td><td><input data-save></td></tr>
    </table>
  </div>

  <details class="card">
    <summary>Equipment & Gold</summary>
    <textarea data-save></textarea>
    <input data-save placeholder="Gold">
  </details>

  <details class="card">
    <summary>Spells & Notes</summary>
    <textarea data-save></textarea>
  </details>
</div>

</div>

<!-- SCRIPT (UNCHANGED CORE LOGIC) -->
<script>
document.querySelectorAll("[data-save]").forEach((f,i)=>{
  const k="cs_"+i;
  if(f.type==="checkbox"){f.checked=localStorage.getItem(k)==="true";f.onchange=()=>localStorage.setItem(k,f.checked);}
  else{f.value=localStorage.getItem(k)||"";f.oninput=()=>localStorage.setItem(k,f.value);}
});

const img=document.getElementById("portrait"),up=document.getElementById("portraitUpload");
const savedImg=localStorage.getItem("portrait");
if(savedImg){img.src=savedImg;img.style.display="block";}
up.onchange=()=>{const r=new FileReader();r.onload=e=>{img.src=e.target.result;img.style.display="block";localStorage.setItem("portrait",e.target.result)};r.readAsDataURL(up.files[0]);};

const hpMax=document.getElementById("hpMax"),hpCur=document.getElementById("hpCur"),hpTemp=document.getElementById("hpTemp"),hpBar=document.getElementById("hpBar");
function updateHP(){const m=+hpMax.value||1,c=+hpCur.value||0,t=+hpTemp.value||0;hpBar.style.width=Math.min(100,(c+t)/m*100)+"%";hpBar.style.background=(c+t)/m>0.5?"green":(c+t)/m>0.25?"yellow":"red";}
[hpMax,hpCur,hpTemp].forEach(e=>e.oninput=updateHP);updateHP();

const manaMax=document.getElementById("manaMax"),manaCur=document.getElementById("manaCur"),manaBar=document.getElementById("manaBar");
function updateMana(){const m=+manaMax.value||1,c=+manaCur.value||0;manaBar.style.width=Math.min(100,c/m*100)+"%";}
[manaMax,manaCur].forEach(e=>e.oninput=updateMana);updateMana();
</script>

</body>
</html>
